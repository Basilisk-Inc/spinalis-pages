<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Название вашего проекта</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 { margin-bottom: 15px; color: #111; }
        p { margin-bottom: 20px; font-size: 1.1rem; color: #555; }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 30px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .buttons { text-align: center; margin-top: 30px; }
        .btn {
            display: inline-block;
            background-color: #0066cc;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0052a3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Описание проекта</h1>
        <p>Здесь напишите краткое описание вашего продукта, его ключевые функции и назначение.</p>

        <!-- Встроенное видео с YouTube -->
        <div class="video-container">
            <!-- Замените VIDEO_ID на ID вашего видео на YouTube -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>

        <p>Загрузите последнюю версию системы и начните работу уже сегодня.</p>

        <!-- Ссылка на скачивание -->
        <div class="buttons">
            <a href="https://github.com/ВАШ_ПОЛЬЗОВАТЕЛЬ/ВАШ_РЕПОЗИТОРИЙ/releases" class="btn">Скачать систему</a>
        </div>
    </div>

</body>
</html>
